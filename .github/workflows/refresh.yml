name: Refresh prices
# Every 15 minutes: wake the website (Render's free plan sleeps when idle) and ask it to refresh
# prices. The site does the fetching itself and runs at most one refresh per 15 minutes, so this
# job needs no secrets: only the repository variable SITE_URL (e.g. https://skyward-xxxx.onrender.com).
# GitHub may delay scheduled runs by a few minutes at busy times.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Wake the site and trigger a refresh
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.SITE_URL }}/api/health"
          curl -fsS --max-time 60 -X POST "${{ vars.SITE_URL }}/api/refresh"

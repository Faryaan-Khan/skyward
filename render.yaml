# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The web service is stateless; all data lives in Postgres (DATABASE_URL, e.g. Neon free tier).
# Scale up later by raising the plan / numInstances / WEB_CONCURRENCY - no code changes needed.
services:
  - type: web
    name: skyward
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-2} --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    autoDeploy: false   # deploys come from .github/workflows/deploy.yml after tests pass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: WEB_CONCURRENCY
        value: "1"   # free plan has 512 MB RAM; raise with a bigger plan
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in the Render dashboard
      - key: ADMIN_TOKEN
        generateValue: true
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
      - key: TRAVELPAYOUTS_MARKER
        sync: false
      - key: SECRET_KEY          # signs email-confirm / unsubscribe / Telegram links
        generateValue: true
      # Price alerts (optional): add these in the Render dashboard when you set them up
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
